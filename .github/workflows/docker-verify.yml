name: Docker verification

# Builds the production Docker image from scratch and verifies:
#   - Git >= 2.41 (OCR requirement, asserted in the Dockerfile AND here)
#   - OCR 1.12.9 is installed
#   - the container boots with dummy config and /healthz + /readyz respond
# Fails on any image/build/runtime problem.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_HOST: 127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image from scratch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: swear-review:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Assert Git >= 2.41
        run: |
          set -euo pipefail
          gv=$(docker run --rm --entrypoint git swear-review:ci --version)
          echo "git: $gv"
          mm=$(echo "$gv" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          maj=${mm%%.*}
          min=${mm##*.}
          if [ "$maj" -gt 2 ] || { [ "$maj" -eq 2 ] && [ "$min" -ge 41 ]; }; then
            echo "PASS: Git >= 2.41"
          else
            echo "FAIL: Git too old: $gv"
            exit 1
          fi

      - name: Assert OCR 1.12.9
        run: |
          set -euo pipefail
          ov=$(docker run --rm --entrypoint ocr swear-review:ci version)
          echo "ocr: $ov"
          if echo "$ov" | grep -q '1.12.9'; then
            echo "PASS: OCR 1.12.9"
          else
            echo "FAIL: OCR version mismatch"
            exit 1
          fi

      - name: Validate bundled OCR tool set
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh swear-review:ci -ec '
            set -eu
            mkdir -p /tmp/ocr-smoke && cd /tmp/ocr-smoke
            git init -q
            git config user.name CI
            git config user.email ci@example.invalid
            printf "first\n" > README.md
            git add . && git commit -qm base
            printf "second\n" > README.md
            git add . && git commit -qm docs
            node -e "const t=JSON.parse(require(\"node:fs\").readFileSync(\"/app/config/ocr-tools-no-search.json\")); const names=t.map(x=>x.name).sort().join(\",\"); if(names!==\"code_comment,file_find,file_read,file_read_diff,task_done\") process.exit(1)"
            OCR_NO_UPDATE=1 NO_COLOR=1 \
              OCR_LLM_URL=http://127.0.0.1:9/v1/chat/completions \
              OCR_LLM_TOKEN=ci-dummy OCR_LLM_MODEL=deepseek-flash \
              ocr review --from HEAD~1 --to HEAD --repo "$PWD" \
              --format json --audience agent \
              --tools /app/config/ocr-tools-no-search.json > /tmp/ocr-result.json
            grep -q "\"status\": \"skipped\"" /tmp/ocr-result.json
            grep -q "\"ocr_version\": \"v1.12.9\"" /tmp/ocr-result.json
          '

      - name: Smoke test /healthz and /readyz
        run: |
          set -euo pipefail
          openssl genrsa -out "$RUNNER_TEMP/gh-key.pem" 2048
          docker run -d --name swear-review-smoke -p 3999:3000 \
            -e GITHUB_APP_ID=123456 \
            -e GITHUB_APP_PRIVATE_KEY_PATH=/gh-key.pem \
            -e GITHUB_WEBHOOK_SECRET=ci-secret \
            -e OPENCODE_GO_KEY=sk-ci-dummy \
            -e CONFIG_PATH=/nonexistent/config.yaml \
            -e DATABASE_PATH=/tmp/ci.db \
            -v "$RUNNER_TEMP/gh-key.pem:/gh-key.pem:ro" \
            swear-review:ci
          trap 'echo "--- container logs ---"; docker logs swear-review-smoke || true; docker rm -f swear-review-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS "http://${CI_HOST}:3999/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" = 1 ] || { echo "FAIL: /healthz never became ready"; exit 1; }
          echo "--- /healthz ---"
          curl -fsS "http://${CI_HOST}:3999/healthz"
          echo
          echo "--- /readyz ---"
          curl -fsS "http://${CI_HOST}:3999/readyz"
          echo
          echo "PASS: health endpoints"
